<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower World</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6') center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backdrop-filter: brightness(0.6);
    text-align: center;
}

.hero h1 {
    font-size: 60px;
    text-shadow: 0 0 20px rgba(255,255,255,0.7);
}

.hero p {
    margin: 15px 0;
    opacity: 0.9;
}

.btn {
    padding: 12px 30px;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff6ec4,#7873f5);
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.1);
}

/* GALLERY */
.gallery {
    padding: 60px 20px;
    text-align: center;
}

.gallery h2 {
    margin-bottom: 30px;
}

.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.grid img {
    width: 250px;
    height: 300px;
    object-fit: cover;
    margin: 10px;
    border-radius: 15px;
    transition: 0.4s;
}

.grid img:hover {
    transform: scale(1.1);
}

/* VIDEO */
.video {
    padding: 50px;
    text-align: center;
}

iframe {
    width: 80%;
    height: 450px;
    border-radius: 15px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    opacity: 0.6;
}
</style>
</head>

<body>

<section class="hero">
    <h1>🌸 Flower World</h1>
    <p>Khám phá vẻ đẹp của thiên nhiên</p>
    <a href="#gallery" class="btn">Xem ngay</a>
</section>

<section class="gallery" id="gallery">
    <h2>Bộ sưu tập hoa</h2>
    <div class="grid">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946">
        <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
        <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6">
    </div>
</section>

<section class="video">
    <h2>Video về hoa</h2>
    <iframe src="https://www.youtube.com/embed/cLOT0APQzDs" allowfullscreen></iframe>
</section>

<footer>
    © 2026 - Flower Website
</footer>

</body>
</html>
